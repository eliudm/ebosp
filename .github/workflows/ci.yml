name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Gate sequence matches dev guide §31. Jobs are chained with `needs:` so a failure at any gate
# stops everything after it - "publish artifacts only if all mandatory gates pass".
jobs:
  backend:
    name: Backend (restore, format, build, test, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ebosp_test
          POSTGRES_PASSWORD: ebosp_test
          POSTGRES_DB: ebosp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebosp_test -d ebosp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=ebosp_test;Username=ebosp_test;Password=ebosp_test"
      # CI-only signing key for the test suite - never used outside this job (dev guide §14).
      Jwt__Issuer: "ebosp-ci"
      Jwt__Audience: "ebosp-ci"
      Jwt__SigningKey: "ci-only-signing-key-not-a-real-secret-please-do-not-reuse-1234567890"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EBOSP.slnx

      - name: Format check
        run: dotnet format EBOSP.slnx --verify-no-changes --no-restore

      # Analyzer diagnostics run as part of build - Directory.Build.props sets
      # AnalysisLevel=latest and TreatWarningsAsErrors=true, so this build IS the static
      # analysis gate.
      - name: Build (Release, analyzers as errors)
        run: dotnet build EBOSP.slnx --no-restore -c Release

      - name: Test with coverage (unit, integration, api, e2e)
        run: >
          dotnet test EBOSP.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage
          retention-days: 14

      # Turns the raw per-project Cobertura XML above into one aggregated, human-readable report
      # (dev guide §31 gate 9: "generate coverage report" - collection alone isn't a report).
      - name: Aggregate coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub"
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Upload aggregated coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage-report
          retention-days: 14

      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          output=$(dotnet list EBOSP.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found - see output above."
            exit 1
          fi
        shell: bash

  frontend:
    name: Frontend (lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # C# needs an actual build to analyze; the JS/TS analysis is build-free (autobuild is a no-op
      # for it and would otherwise try, and fail, to build the .NET solution too).
      - name: Build backend
        if: matrix.language == 'csharp'
        run: dotnet build EBOSP.slnx -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Build and scan container images
    runs-on: ubuntu-latest
    needs: [secret-scan]
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ebosp-${{ matrix.name }}:ci

      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ebosp-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  publish-artifacts:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: [backend, frontend, codeql, secret-scan, container-scan]
    if: success()
    steps:
      - name: All mandatory gates passed
        run: echo "Backend, frontend, CodeQL, secret scan and container scans all passed - artifacts above are the release candidate."
